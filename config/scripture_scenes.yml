# Scripture scene pictures: faint background engravings shown behind the chapter being read.
# Every image is a Gustave Doré Bible engraving (1866) from Wikimedia Commons, processed to
# public/scenes/<key>.webp (1200px wide, greyscale, ~110 KB max).
#
# Rule: only files that Commons marks as PUBLIC DOMAIN may be added (check the licence on the
# file page).
#
# To add a picture: download the file from Commons, convert it (e.g.
#   magick in.jpg -colorspace Gray -resize 1200x -blur 0x0.9 -strip tmp.png && cwebp -q 50 tmp.png -o public/scenes/<key>.webp),
# then add an entry below in Bible order. key = <osis lowercase>-<chapter, 2 digits (3 for Ps)>-<slug>.
# verse may be null when the picture belongs to the whole chapter. plate = Doré plate number
# from the Commons "Doré's English Bible" file name (null if not numbered there).

